name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: swift build
      - name: Test
        # smoke tests bcs the rest need wifi, test on device before PRing
        run: >-
          swift test
          --skip "InnerTubeLiveTests"
          --skip "YouTubeParserLiveTests"
          --skip "StreamingTests/(liveDuration|liveResolveHandler)"
